services:
  db:
    image: postgis/postgis:16-3.4
    container_name: flowshield_db
    environment:
      POSTGRES_DB: flowshield
      POSTGRES_USER: flowshield
      POSTGRES_PASSWORD: flowshield_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowshield -d flowshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: flowshield_api
    environment:
      DATABASE_URL: postgresql://flowshield:flowshield_secret@db:5432/flowshield
      JWT_SECRET: dev_jwt_secret_flowshield_sih_2026
      DEMO_MODE: "true"
      SCENARIO_SEED: 26192
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed_db.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: flowshield_web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
