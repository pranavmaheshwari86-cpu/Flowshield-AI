# SCIENTIFIC NOTE (§65):
# The August 6, 2010 Leh cloudburst produced ~120 mm of rainfall within
# approximately 2 hours over a localized area near Leh/Choglamsar.
# The exact peak intensity measurement varies across sources:
# - IMD Leh station: ~76 mm in 2 hours (manual gauge)
# - Kumar et al. (2012): "extraordinary" event; >100 mm inferred from satellite
# - Thayyen et al. (2013): 120 mm estimated total
# We do NOT hard-code ">200 mm/hr" as no authoritative sub-hourly measurement
# at that resolution is publicly verified. The event is labeled based on
# confirmed disaster records from SDMA/NDMA/DesInventar.
reference_events:
  - event: "2010 Leh Cloudburst"
    date: "2010-08-06"
    verified_precipitation_mm: 120.0
    temporal_resolution: "~2 hours cumulative estimate"
    source: "Kumar et al. 2012; NDMA; SDMA Ladakh"

training_period:
  start: "2018-01-01"
  end: "2023-06-30"

validation_period:
  start: "2023-07-01"
  end: "2023-12-31"

holdout_period:
  start: "2024-01-01"
  end: "2024-06-30"

data_sources:
  meteorology: "ERA5-Land via Open-Meteo Archive"
  flood_events:
    - "SDMA Ladakh historical records"
    - "NDMA event database"
    - "DesInventar / UNDRR cross-reference"
    - "Published literature (Kumar et al. 2012)"
  terrain: "SRTM 30m / Copernicus DEM (pre-computed)"

model_defaults:
  candidates:
    - "logistic_regression"
    - "random_forest"
    - "xgboost"
  recall_bar: 0.85
  fpr_bar: 0.15
  calibration_methods:
    - "isotonic"
    - "sigmoid"
