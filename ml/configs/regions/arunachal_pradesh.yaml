    dist_to_river_m: 30.0
    upstream_drainage_sqkm: 22300.0
    role: "train"
  ALN_SUB_03:
    name: "Aalo / Siyom River"
    latitude: 28.1700
    longitude: 94.7900
    elevation_m: 310.0
    catchment_slope_deg: 22.0
    dist_to_river_m: 60.0
    upstream_drainage_sqkm: 4500.0
