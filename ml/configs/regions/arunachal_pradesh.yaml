# ml/configs/regions/arunachal_pradesh.yaml
# Flowshield — Arunachal Pradesh Regional Configuration
# Siang (Brahmaputra), Subansiri, Kameng, Lohit River Basins

region:
  slug: "arunachal_pradesh"
  display_name: "Arunachal Pradesh"
  state: "Arunachal Pradesh"
  primary_basin: "Siang, Subansiri, Kameng, Lohit"
  climate_zone: "Eastern Himalayan subtropical / monsoon"

boundary:
  lat_min: 26.50
  lat_max: 29.50
  lon_min: 91.50
  lon_max: 97.50

