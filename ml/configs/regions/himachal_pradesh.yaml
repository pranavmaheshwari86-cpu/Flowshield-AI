# ml/configs/regions/himachal_pradesh.yaml
# Flowshield — Himachal Pradesh Regional Configuration (Reference Architecture)
# Beas River Basin, Mandi District

region:
  slug: "himachal_pradesh"
  display_name: "Himachal Pradesh"
  state: "Himachal Pradesh"
  primary_basin: "Beas River Basin"
  climate_zone: "Western Himalayan montane"

boundary:
