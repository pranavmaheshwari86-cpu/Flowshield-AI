reference_events:
  - event: "July 2023 Beas Basin Catastrophic Flash Flood"
    date_start: "2023-07-08"
    date_end: "2023-07-11"
    peak_discharge_cumec: 3800.0
    source: "HPSDMA Disaster Report 2023; CWC Flood Bulletin July 2023"
  - event: "August 2023 Dharampur Son Khad Cloudburst"
    date_start: "2023-08-12"
    date_end: "2023-08-15"
    peak_discharge_cumec: 2100.0
    source: "HPSDMA Flash Flood Assessment August 2023"

training_period:
  start: "2018-01-01"
  end: "2023-06-30"

validation_period:
  start: "2023-07-01"
  end: "2023-08-31"

holdout_period:
  start: "2023-09-01"
  end: "2024-06-30"

data_sources:
  meteorology: "ERA5-Land via Open-Meteo Archive"
  flood_events:
    - "IndoFloods (CWC Beas Basin gauges)"
    - "HiFlo-DAT Himalayan Flood Database"
    - "HPSDMA historical event records"
  terrain: "SRTM 30m / Copernicus DEM (pre-computed)"

model_defaults:
  candidates:
    - "logistic_regression"
    - "random_forest"
    - "xgboost"
  recall_bar: 0.85
  fpr_bar: 0.15
  calibration_methods:
    - "isotonic"
    - "sigmoid"
