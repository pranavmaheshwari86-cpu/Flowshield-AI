    dist_to_river_m: 35.0
    upstream_drainage_sqkm: 6350.0
    role: "train"
  PND_DAM_02:
    name: "Pandoh Dam Reservoir"
    latitude: 31.6681
    longitude: 77.0583
    elevation_m: 895.0
    catchment_slope_deg: 22.0
    dist_to_river_m: 45.0
    upstream_drainage_sqkm: 5400.0
    role: "spatial_holdout_val"
  AUT_JNC_03:
    name: "Aut Junction / Larji Dam"
    latitude: 31.7250
    longitude: 77.2100
    elevation_m: 980.0
