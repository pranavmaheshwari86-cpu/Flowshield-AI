training_period:
  start: "2018-01-01"
  end: "2023-06-30"

validation_period:
  start: "2023-07-01"
  end: "2023-12-31"

holdout_period:
  start: "2024-01-01"
  end: "2024-06-30"

data_sources:
  meteorology: "ERA5-Land via Open-Meteo Archive"
  flood_events:
    - "IndoFloods (limited CWC coverage)"
    - "SDMA Nagaland historical records"
  terrain: "SRTM 30m / Copernicus DEM (pre-computed)"

model_defaults:
  candidates:
    - "logistic_regression"
    - "random_forest"
    - "xgboost"
  recall_bar: 0.85
  fpr_bar: 0.15
  calibration_methods:
    - "isotonic"
    - "sigmoid"

data_quality_notes:
  - "Limited CWC gauge coverage in NE India"
  - "Fewer verified flood events compared to Himalayan basins"
  - "Model may receive VALIDATION_ONLY status if event count < 30"
