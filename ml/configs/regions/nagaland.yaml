  DMP_DOY_02:
    name: "Dimapur / Dhansiri River"
    latitude: 25.9065
    longitude: 93.7266
    elevation_m: 154.0
    catchment_slope_deg: 8.0
    dist_to_river_m: 40.0
    upstream_drainage_sqkm: 3200.0
    role: "train"
  MOK_DOY_03:
    name: "Mokokchung / Doyang River"
    latitude: 26.3220
    longitude: 94.5210
    elevation_m: 1325.0
    catchment_slope_deg: 22.0
    dist_to_river_m: 180.0
    upstream_drainage_sqkm: 1500.0
