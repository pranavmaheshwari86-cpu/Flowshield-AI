    elevation_m: 1585.0
    catchment_slope_deg: 12.0
    dist_to_river_m: 40.0
    upstream_drainage_sqkm: 9480.0
    role: "train"
  ANN_CHN_02:
    name: "Anantnag / Jhelum Upper Reach"
    latitude: 33.7311
    longitude: 75.1547
    elevation_m: 1640.0
    catchment_slope_deg: 18.0
    dist_to_river_m: 80.0
    upstream_drainage_sqkm: 4200.0
    role: "train"
  BRM_CHN_03:
    name: "Banihal / Chenab Tributary"
    latitude: 33.4397
    longitude: 75.1982
    elevation_m: 1700.0
    catchment_slope_deg: 28.0
    dist_to_river_m: 120.0
    upstream_drainage_sqkm: 2100.0
    role: "train"
  JMU_TWI_04:
    name: "Jammu / Tawi River"
    latitude: 32.7266
    longitude: 74.8570
    elevation_m: 327.0
    catchment_slope_deg: 8.0
