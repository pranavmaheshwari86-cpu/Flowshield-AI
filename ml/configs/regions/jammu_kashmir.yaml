# ml/configs/regions/jammu_kashmir.yaml
# Flowshield — Jammu & Kashmir Regional Configuration
# Jhelum River Basin & Chenab River Basin

region:
  slug: "jammu_kashmir"
  display_name: "Jammu & Kashmir"
  state: "Jammu & Kashmir"
  primary_basin: "Jhelum & Chenab River Basins"
  climate_zone: "Western Himalayan temperate / sub-tropical"

boundary:
  lat_min: 32.50
  lat_max: 34.80
  lon_min: 73.50
  lon_max: 76.00

stations:
